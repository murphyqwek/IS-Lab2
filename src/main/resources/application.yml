server:
  port: 2720
  servlet:
    session:
      timeout: 30m

spring:
    servlet:
      multipart:
        max-file-size: 1MB
        max-request-size: 2MB
    datasource:
      url: ${POSTGRES_URL}
      username: ${POSTGRES_USERNAME}
      password: ${POSTGRES_PASSWORD}
      hikari:
        maximum-pool-size: 2
        minimum-idle: 1

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true