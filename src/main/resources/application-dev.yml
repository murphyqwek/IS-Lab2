server:
  port: 2721
  servlet:
    session:
      timeout: 30m

spring:
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  datasource:
    url: jdbc:postgresql://localhost:5433/studs
    username: myuser
    password: mypassword
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true